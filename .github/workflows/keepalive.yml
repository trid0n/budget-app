name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'  # daily — well inside Supabase's 7-day free-tier pause window
  workflow_dispatch: {}     # allows a manual "Run workflow" click to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/user_settings?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
